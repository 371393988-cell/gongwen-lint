[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gongwen-lint"
version = "0.1.0"
description = "A local, explainable linter for Chinese official documents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "371393988-cell"}]
keywords = ["chinese", "documents", "lint", "docx", "government"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Repository = "https://github.com/371393988-cell/gongwen-lint"
Issues = "https://github.com/371393988-cell/gongwen-lint/issues"

[project.scripts]
gongwen-lint = "gongwen_lint.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
