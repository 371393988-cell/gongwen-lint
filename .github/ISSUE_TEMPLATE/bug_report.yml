name: 缺陷报告
description: 报告可使用合成材料复现的程序错误
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴真实机关文稿、个人信息、内部路径或其他敏感内容。请使用人工编写的最小合成样例。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 例如 v0.1.0
    validations:
      required: true
  - type: dropdown
    id: input_type
    attributes:
      label: 输入类型
      options:
        - TXT
        - Markdown
        - DOCX
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供命令和最小合成样例，不要上传真实文稿。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认提交内容不含真实公文、个人信息和内部材料。
          required: true
